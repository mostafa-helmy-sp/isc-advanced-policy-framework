name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Reject internal registry URLs in the lockfile
        run: |
          if grep -q 'sailpoint.jfrog.io' package-lock.json; then
            echo "package-lock.json must not pin packages to an internal registry"
            exit 1
          fi
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package connector
        if: github.event_name == 'push'
        run: npm run pack-zip --ignore-scripts
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          zip="dist/advanced-policy-framework-${version}.zip"
          notes=$(mktemp)
          if [ ! -f "$zip" ]; then
            echo "Missing connector package: $zip"
            exit 1
          fi
          RELEASE_VERSION="$version" RELEASE_NOTES="$notes" node <<'EOF'
          const fs = require('fs')
          const version = process.env.RELEASE_VERSION
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/)
          const start = lines.findIndex((line) => line.startsWith(`## ${version}`))
          if (start === -1) {
            console.error(`CHANGELOG.md has no section for ${version}`)
            process.exit(1)
          }
          let end = lines.findIndex((line, index) => index > start && line.startsWith('## '))
          if (end === -1) end = lines.length
          const body = lines.slice(start + 1, end).join('\n').trim()
          if (!body) {
            console.error(`CHANGELOG.md section for ${version} is empty`)
            process.exit(1)
          }
          fs.writeFileSync(process.env.RELEASE_NOTES, `${lines[start]}\n\n${body}\n`)
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --latest \
              --title "$tag" \
              --notes-file "$notes"
          fi
