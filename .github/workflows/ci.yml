name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Reject internal registry URLs in the lockfile
        run: |
          if grep -q 'sailpoint.jfrog.io' package-lock.json; then
            echo "package-lock.json must not pin packages to an internal registry"
            exit 1
          fi
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
